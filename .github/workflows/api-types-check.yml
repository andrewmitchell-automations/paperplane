name: API types check

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  generated-check:
    name: check:api-types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: plane.settings.production
      # Schema generation reads views and serializers only; nothing is contacted.
      SECRET_KEY: ci-api-types-check
      REDIS_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # uv version comes from [tool.uv] required-version.
          version-file: "apps/api/pyproject.toml"
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked --no-default-groups --group dev

      - name: Regenerate the OpenAPI schemas
        working-directory: apps/api
        run: uv run --no-sync python manage.py generate_openapi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @plane/api-types

      - name: Regenerate the TypeScript types
        run: pnpm --filter @plane/api-types run generate

      - name: Check the committed output is current
        run: |
          git status --porcelain -- apps/api/openapi packages/api-types/src/generated | tee stale-generated.txt
          if [ -s stale-generated.txt ]; then
            git diff --stat -- apps/api/openapi packages/api-types/src/generated
            echo "::error::Run 'python manage.py generate_openapi' in apps/api and 'pnpm --filter @plane/api-types run generate', then commit the result."
            exit 1
          fi
